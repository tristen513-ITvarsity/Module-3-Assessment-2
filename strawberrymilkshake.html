<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tristen's Flame Kitchen | Chocolate Lava Cake</title>
  <link rel="stylesheet" href="styls.css">
  <link rel="stylesheet" href="fontAwesome/css/all.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="drinks.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
      <a href="index.html" class="brand">
        <img src="Images/tristen-logo.svg" alt="logo" class="brand-logo">
        <h1>Tristen's Flame Kitchen</h1>
      </a>
    </header>

    <section class="item-wrap">
      <article class="item-panel">
        <img src="Images/dessert-lava-cake.jpg" alt="Chocolate Lava Cake" class="item-image">
        <h2>Chocolate Lava Cake</h2>
        <div class="price-line"><span>Price: R86</span><span>Serving: 1 cake + scoop</span></div>
        <p>Warm chocolate cake with a flowing chocolate center, served with vanilla ice cream.</p>
        <h3>Optional Extras</h3>
        <ul class="extras">
          <li>Extra ice cream scoop</li>
          <li>Chocolate drizzle</li>
          <li>Crushed nuts</li>
        </ul>
      </article>

      <section class="form-panel">
        <h3>Special Notes</h3>
        <form action="order-success.html" method="get">
          <label for="notes">Add extra requests for your order</label>
          <textarea id="notes" name="notes" rows="8" placeholder="Example: extra hot cake"></textarea>
          <button type="submit" class="order-btn">Place Order</button>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
