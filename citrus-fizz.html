<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flame & Fork | Citrus Fizz</title>
  <link rel="stylesheet" href="styls.css">
  <link rel="stylesheet" href="fontAwesome/css/all.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="drinks.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
      <a href="index.html" class="brand"><span class="brand-mark"><i class="fas fa-utensils"></i></span><h1>Flame & Fork</h1></a>
    </header>

    <section class="item-wrap">
      <article class="item-panel">
        <img src="Images/strawberryMilkshake.png" alt="Citrus Fizz" class="item-image">
        <h2>Citrus Fizz</h2>
        <div class="price-line"><span>Price: R36</span><span>Serving: 400ml</span></div>
        <p>Sparkling citrus drink with orange, lemon and fresh mint.</p>
        <h3>Optional Extras</h3>
        <ul class="extras">
          <li>Extra mint</li>
          <li>No sugar syrup</li>
          <li>Lime wedge</li>
        </ul>
      </article>

      <section class="form-panel">
        <h3>Special Notes</h3>
        <form action="order-success.html" method="get">
          <label for="notes">Add extra requests for this drink</label>
          <textarea id="notes" name="notes" rows="8" placeholder="Example: less ice, extra lemon"></textarea>
          <button type="submit" class="order-btn">Place Order</button>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
