<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tristen's Flame Kitchen | Crispy Calamari</title>
  <link rel="stylesheet" href="styls.css">
  <link rel="stylesheet" href="fontAwesome/css/all.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="starters.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
      <a href="index.html" class="brand">
        <img src="Images/tristen-logo.svg" alt="logo" class="brand-logo">
        <h1>Tristen's Flame Kitchen</h1>
      </a>
    </header>

    <section class="item-wrap">
      <article class="item-panel">
        <img src="Images/starter-calamari.jpg" alt="Crispy Calamari" class="item-image">
        <h2>Crispy Calamari</h2>
        <div class="price-line"><span>Price: R82</span><span>Serving: 280g plate</span></div>
        <p>Tender calamari rings crumbed and fried until golden, served with lemon aioli and fresh herbs.</p>
        <h3>Optional Extras</h3>
        <ul class="extras">
          <li>Extra lemon aioli</li>
          <li>Sweet chili dip</li>
          <li>Garlic butter drizzle</li>
        </ul>
      </article>

      <section class="form-panel">
        <h3>Special Notes</h3>
        <form action="order-success.html" method="get">
          <label for="notes">Add extra requests for your order</label>
          <textarea id="notes" name="notes" rows="8" placeholder="Example: extra crispy"></textarea>
          <button type="submit" class="order-btn">Place Order</button>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
