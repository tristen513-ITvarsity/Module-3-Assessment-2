<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flame & Fork | Cinnamon Raisin Cookies</title>
  <link rel="stylesheet" href="styls.css">
  <link rel="stylesheet" href="fontAwesome/css/all.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="starters.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
      <a href="index.html" class="brand"><span class="brand-mark"><i class="fas fa-utensils"></i></span><h1>Flame & Fork</h1></a>
    </header>
    <section class="item-wrap">
      <article class="item-panel">
        <img src="Images/cookies.png" alt="Cinnamon Raisin Cookies" class="item-image">
        <h2>Cinnamon Raisin Cookies</h2>
        <div class="price-line"><span>Price: R39</span><span>Serving: 4 cookies</span></div>
        <p>Soft cookies infused with cinnamon and juicy raisins.</p>
        <h3>Optional Extras</h3>
        <ul class="extras"><li>Honey drizzle</li><li>Whipped cream</li><li>Extra cinnamon dust</li></ul>
      </article>
      <section class="form-panel">
        <h3>Special Notes</h3>
        <form action="order-success.html" method="get">
          <label for="notes">Add extra requests for this dessert</label>
          <textarea id="notes" name="notes" rows="8" placeholder="Example: less cinnamon, warm serve"></textarea>
          <button type="submit" class="order-btn">Place Order</button>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
