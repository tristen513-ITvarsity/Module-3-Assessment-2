<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flame & Fork | Crispy Mushroom Bites</title>
  <link rel="stylesheet" href="styls.css">
  <link rel="stylesheet" href="fontAwesome/css/all.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="starters.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
      <a href="index.html" class="brand"><span class="brand-mark"><i class="fas fa-utensils"></i></span><h1>Flame & Fork</h1></a>
    </header>

    <section class="item-wrap">
      <article class="item-panel">
        <img src="Images/grilledCheese.png" alt="Crispy Mushroom Bites" class="item-image">
        <h2>Crispy Mushroom Bites</h2>
        <div class="price-line"><span>Price: R56</span><span>Serving: 10 bites</span></div>
        <p>Crumbed mushrooms served hot with a creamy house dip.</p>
        <h3>Optional Extras</h3>
        <ul class="extras">
          <li>Lemon wedge</li>
          <li>Extra aioli</li>
          <li>Sweet chili dip</li>
        </ul>
      </article>

      <section class="form-panel">
        <h3>Special Notes</h3>
        <form action="order-success.html" method="get">
          <label for="notes">Add extra requests for this meal</label>
          <textarea id="notes" name="notes" rows="8" placeholder="Example: extra crispy, no chili"></textarea>
          <button type="submit" class="order-btn">Place Order</button>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
