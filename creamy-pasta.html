<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flame & Fork | Herb Butter Melt</title>
  <link rel="stylesheet" href="styls.css">
  <link rel="stylesheet" href="fontAwesome/css/all.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="mains.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
      <a href="index.html" class="brand"><span class="brand-mark"><i class="fas fa-utensils"></i></span><h1>Flame & Fork</h1></a>
    </header>
    <section class="item-wrap">
      <article class="item-panel">
        <img src="Images/grilledCheese.png" alt="Herb Butter Melt" class="item-image">
        <h2>Herb Butter Melt</h2>
        <div class="price-line"><span>Price: R88</span><span>Serving: 1 sandwich</span></div>
        <p>Golden cheese melt finished with parsley and garlic herb butter.</p>
        <h3>Optional Extras</h3>
        <ul class="extras"><li>Tomato soup dip</li><li>Extra herbs</li><li>Garlic butter brush</li></ul>
      </article>
      <section class="form-panel">
        <h3>Special Notes</h3>
        <form action="order-success.html" method="get">
          <label for="notes">Add extra requests for this meal</label>
          <textarea id="notes" name="notes" rows="8" placeholder="Example: no garlic, extra cheese"></textarea>
          <button type="submit" class="order-btn">Place Order</button>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
