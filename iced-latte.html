<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tristen's Flame Kitchen | Berry Waffle Sundae</title>
  <link rel="stylesheet" href="styls.css">
  <link rel="stylesheet" href="fontAwesome/css/all.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="drinks.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
      <a href="index.html" class="brand">
        <img src="Images/tristen-logo.svg" alt="logo" class="brand-logo">
        <h1>Tristen's Flame Kitchen</h1>
      </a>
    </header>

    <section class="item-wrap">
      <article class="item-panel">
        <img src="Images/dessert-waffle.jpg" alt="Berry Waffle Sundae" class="item-image">
        <h2>Berry Waffle Sundae</h2>
        <div class="price-line"><span>Price: R92</span><span>Serving: 1 plated dessert</span></div>
        <p>Fresh waffle topped with berry compote, vanilla ice cream, and a dusting of icing sugar.</p>
        <h3>Optional Extras</h3>
        <ul class="extras">
          <li>Extra berry sauce</li>
          <li>Chocolate sauce</li>
          <li>Extra waffle quarter</li>
        </ul>
      </article>

      <section class="form-panel">
        <h3>Special Notes</h3>
        <form action="order-success.html" method="get">
          <label for="notes">Add extra requests for your order</label>
          <textarea id="notes" name="notes" rows="8" placeholder="Example: extra ice cream"></textarea>
          <button type="submit" class="order-btn">Place Order</button>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
