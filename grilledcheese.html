<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tristen's Flame Kitchen | Flame-Grilled Ribeye</title>
  <link rel="stylesheet" href="styls.css">
  <link rel="stylesheet" href="fontAwesome/css/all.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a href="mains.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
      <a href="index.html" class="brand">
        <img src="Images/tristen-logo.svg" alt="logo" class="brand-logo">
        <h1>Tristen's Flame Kitchen</h1>
      </a>
    </header>

    <section class="item-wrap">
      <article class="item-panel">
        <img src="Images/main-ribeye.jpg" alt="Flame-Grilled Ribeye" class="item-image">
        <h2>Flame-Grilled Ribeye</h2>
        <div class="price-line"><span>Price: R229</span><span>Serving: 350g steak</span></div>
        <p>Prime ribeye grilled over open flame, served with rosemary butter and seasonal vegetables.</p>
        <h3>Optional Extras</h3>
        <ul class="extras">
          <li>Mushroom sauce</li>
          <li>Pepper sauce</li>
          <li>Garlic mashed potatoes</li>
        </ul>
      </article>

      <section class="form-panel">
        <h3>Special Notes</h3>
        <form action="order-success.html" method="get">
          <label for="notes">Add extra requests for your order</label>
          <textarea id="notes" name="notes" rows="8" placeholder="Example: medium-rare"></textarea>
          <button type="submit" class="order-btn">Place Order</button>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
